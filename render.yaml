services:
  - type: web
    name: predikta
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PREDIKTA_AUTOUPDATE_SEC
        value: "1800"
    autoDeploy: true
