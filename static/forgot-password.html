<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mot de passe oublié — PREDIKTA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script src="/nav.js" defer></script>
<style>
:root{--bg:#04040f;--card:#0b0b22;--border:#1a1a45;--accent:#4f6eff;--accent2:#8855ff;--gold:#ffd700;--green:#22e87a;--red:#ff5577;--text:#e8eeff;--muted:#4d5a8a;--muted2:#7888bb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(79,110,255,.07) 0%,transparent 60%)}
.page{max-width:440px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}
h1{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;background:linear-gradient(135deg,#6688ff,#aa66ff,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;text-align:center}
.subtitle{font-size:.85rem;color:var(--muted2);margin-bottom:28px;line-height:1.7;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.card::before{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:20px}
label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--muted2)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#04040f;color:var(--text);font-size:.9rem;font-family:inherit;margin-bottom:16px}
input:focus{outline:none;border-color:var(--accent)}
button.submit{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
button.submit:disabled{opacity:.6;cursor:default}
.msg{font-size:.8rem;margin-top:14px;text-align:center;line-height:1.6}
.msg.error{color:var(--red)}
.msg.success{color:var(--green)}
.alt{text-align:center;font-size:.82rem;color:var(--muted2);margin-top:6px}
.alt a{color:var(--accent);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="page">
  <h1 data-i18n="title">Mot de passe oublié</h1>
  <p class="subtitle" data-i18n="subtitle">Entre ton email, on t'envoie un lien pour choisir un nouveau mot de passe.</p>

  <div class="card">
    <label for="fEmail" data-i18n="lblEmail">Email</label>
    <input type="email" id="fEmail" placeholder="ton@email.com" autocomplete="email"/>

    <button class="submit" id="btnSend" data-i18n="btnSend">Envoyer le lien</button>
    <div class="msg" id="msg"></div>
    <div class="alt"><a href="/login" data-i18n="backLogin">← Retour à la connexion</a></div>
  </div>
</div>

<script>
const T = {
  fr:{title:"Mot de passe oublié",subtitle:"Entre ton email, on t'envoie un lien pour choisir un nouveau mot de passe.",
    lblEmail:"Email",btnSend:"Envoyer le lien",backLogin:"← Retour à la connexion",
    errFields:"Merci d'entrer ton email.",errEmail:"Email invalide.",
    success:"Si un compte existe avec cet email, un lien de réinitialisation a été envoyé.",},
  en:{title:"Forgot password",subtitle:"Enter your email and we'll send you a link to choose a new password.",
    lblEmail:"Email",btnSend:"Send link",backLogin:"← Back to login",
    errFields:"Please enter your email.",errEmail:"Invalid email.",
    success:"If an account exists for this email, a reset link has been sent.",},
  es:{title:"¿Olvidaste tu contraseña?",subtitle:"Ingresa tu correo y te enviaremos un enlace para elegir una nueva contraseña.",
    lblEmail:"Correo",btnSend:"Enviar enlace",backLogin:"← Volver a iniciar sesión",
    errFields:"Ingresa tu correo.",errEmail:"Correo inválido.",
    success:"Si existe una cuenta con este correo, se envió un enlace de restablecimiento.",},
  pt:{title:"Esqueceu a senha",subtitle:"Digite seu email e enviaremos um link para escolher uma nova senha.",
    lblEmail:"Email",btnSend:"Enviar link",backLogin:"← Voltar para o login",
    errFields:"Digite seu email.",errEmail:"Email inválido.",
    success:"Se existir uma conta com este email, um link de redefinição foi enviado.",},
  ht:{title:"Bliye modpas",subtitle:"Antre imel ou, n ap voye yon lyen pou ou chwazi yon nouvo modpas.",
    lblEmail:"Imel",btnSend:"Voye lyen an",backLogin:"← Tounen nan koneksyon",
    errFields:"Tanpri antre imel ou.",errEmail:"Imel envalid.",
    success:"Si yon kont egziste ak imel sa a, yon lyen reyinisyalizasyon te voye.",},
};
let curLang = (window.PREDIKTA_LANG || localStorage.getItem('predikta_lang') || 'fr');
if(!T[curLang]) curLang='fr';
function applyLang(lang){
  curLang = T[lang]?lang:'fr';
  const dict = T[curLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k]) el.textContent = dict[k];
  });
}
window.setLang = applyLang;
applyLang(curLang);

const msgEl = document.getElementById('msg');
document.getElementById('btnSend').addEventListener('click', async ()=>{
  const dict = T[curLang];
  const email = document.getElementById('fEmail').value.trim();
  msgEl.className='msg';
  if(!email){ msgEl.textContent=dict.errFields; msgEl.className='msg error'; return; }

  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data = await r.json();
    if(!r.ok){ msgEl.textContent = data.error || dict.errEmail; msgEl.className='msg error'; btn.disabled=false; return; }
    msgEl.textContent = dict.success; msgEl.className='msg success';
  }catch(e){
    msgEl.textContent = 'Error: '+e.message; msgEl.className='msg error'; btn.disabled=false;
  }
});

document.getElementById('fEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnSend').click(); });
</script>
</body></html>
