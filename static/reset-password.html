<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Nouveau mot de passe — ZYNORIQ</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script src="/nav.js" defer></script>
<style>
:root{--bg:#04040f;--card:#0b0b22;--border:#1a1a45;--accent:#1479FF;--accent2:#004DFF;--gold:#ffd700;--green:#22e87a;--red:#ff5577;--text:#e8eeff;--muted:#4d5a8a;--muted2:#1479FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(79,110,255,.07) 0%,transparent 60%)}
.page{max-width:440px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}
h1{font-family:'Orbitron',monospace;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;background:linear-gradient(135deg,#6688ff,#aa66ff,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;text-align:center}
.subtitle{font-size:.85rem;color:var(--muted2);margin-bottom:28px;line-height:1.7;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.card::before{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:20px}
label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:var(--muted2)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#04040f;color:var(--text);font-size:.9rem;font-family:inherit;margin-bottom:16px}
input:focus{outline:none;border-color:var(--accent)}
button.submit{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
button.submit:disabled{opacity:.6;cursor:default}
.msg{font-size:.8rem;margin-top:14px;text-align:center;line-height:1.6}
.msg.error{color:var(--red)}
.msg.success{color:var(--green)}
.alt{text-align:center;font-size:.82rem;color:var(--muted2);margin-top:6px}
.alt a{color:var(--accent);text-decoration:none;font-weight:700}
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:44px}
.pwd-toggle{position:absolute;right:6px;top:0;height:46px;width:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;font-size:1.05rem;color:var(--muted2)}
.pwd-toggle:hover{color:var(--text)}
</style>
</head>
<body>
<div class="page">
  <h1 data-i18n="title">Nouveau mot de passe</h1>
  <p class="subtitle" data-i18n="subtitle">Choisis un nouveau mot de passe pour ton compte ZYNORIQ.</p>

  <div class="card">
    <label for="rPassword" data-i18n="lblPassword">Nouveau mot de passe</label>
    <div class="pwd-wrap">
      <input type="password" id="rPassword" placeholder="••••••••" autocomplete="new-password"/>
      <button type="button" class="pwd-toggle" id="togglePwd1" aria-label="Afficher le mot de passe">👁️</button>
    </div>

    <label for="rPassword2" data-i18n="lblPassword2">Confirmer le mot de passe</label>
    <div class="pwd-wrap">
      <input type="password" id="rPassword2" placeholder="••••••••" autocomplete="new-password"/>
      <button type="button" class="pwd-toggle" id="togglePwd2" aria-label="Afficher le mot de passe">👁️</button>
    </div>

    <button class="submit" id="btnReset" data-i18n="btnReset">Réinitialiser</button>
    <div class="msg" id="msg"></div>
    <div class="alt"><a href="/login" data-i18n="backLogin">← Retour à la connexion</a></div>
  </div>
</div>

<script>
const T = {
  fr:{title:"Nouveau mot de passe",subtitle:"Choisis un nouveau mot de passe pour ton compte ZYNORIQ.",
    lblPassword:"Nouveau mot de passe",lblPassword2:"Confirmer le mot de passe",btnReset:"Réinitialiser",backLogin:"← Retour à la connexion",
    errFields:"Merci de remplir les deux champs.",errLength:"Le mot de passe doit contenir au moins 8 caractères.",
    errMatch:"Les mots de passe ne correspondent pas.",errToken:"Lien invalide ou expiré.",
    success:"Mot de passe mis à jour ! Redirection vers la connexion...",},
  en:{title:"New password",subtitle:"Choose a new password for your ZYNORIQ account.",
    lblPassword:"New password",lblPassword2:"Confirm password",btnReset:"Reset password",backLogin:"← Back to login",
    errFields:"Please fill in both fields.",errLength:"Password must be at least 8 characters.",
    errMatch:"Passwords do not match.",errToken:"Invalid or expired link.",
    success:"Password updated! Redirecting to login...",},
  es:{title:"Nueva contraseña",subtitle:"Elige una nueva contraseña para tu cuenta ZYNORIQ.",
    lblPassword:"Nueva contraseña",lblPassword2:"Confirmar contraseña",btnReset:"Restablecer",backLogin:"← Volver a iniciar sesión",
    errFields:"Completa ambos campos.",errLength:"La contraseña debe tener al menos 8 caracteres.",
    errMatch:"Las contraseñas no coinciden.",errToken:"Enlace inválido o expirado.",
    success:"¡Contraseña actualizada! Redirigiendo al inicio de sesión...",},
  pt:{title:"Nova senha",subtitle:"Escolha uma nova senha para sua conta ZYNORIQ.",
    lblPassword:"Nova senha",lblPassword2:"Confirmar senha",btnReset:"Redefinir",backLogin:"← Voltar para o login",
    errFields:"Preencha os dois campos.",errLength:"A senha deve ter pelo menos 8 caracteres.",
    errMatch:"As senhas não coincidem.",errToken:"Link inválido ou expirado.",
    success:"Senha atualizada! Redirecionando para o login...",},
  ht:{title:"Nouvo modpas",subtitle:"Chwazi yon nouvo modpas pou kont ZYNORIQ ou.",
    lblPassword:"Nouvo modpas",lblPassword2:"Konfime modpas",btnReset:"Reyinisyalize",backLogin:"← Tounen nan koneksyon",
    errFields:"Tanpri ranpli toude chan yo.",errLength:"Modpas la dwe gen omwen 8 karaktè.",
    errMatch:"Modpas yo pa menm.",errToken:"Lyen envalid oswa ekspire.",
    success:"Modpas mete ajou! N ap redirije nan koneksyon...",},
};
let curLang = (window.PREDIKTA_LANG || localStorage.getItem('predikta_lang') || 'fr');
if(!T[curLang]) curLang='fr';
function applyLang(lang){
  curLang = T[lang]?lang:'fr';
  const dict = T[curLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k]) el.textContent = dict[k];
  });
}
window.setLang = applyLang;
applyLang(curLang);

function setupToggle(btnId, inputId){
  document.getElementById(btnId).addEventListener('click', ()=>{
    const pwd = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁️';
  });
}
setupToggle('togglePwd1','rPassword');
setupToggle('togglePwd2','rPassword2');

const msgEl = document.getElementById('msg');
const token = new URLSearchParams(location.search).get('token') || '';

document.getElementById('btnReset').addEventListener('click', async ()=>{
  const dict = T[curLang];
  const p1 = document.getElementById('rPassword').value;
  const p2 = document.getElementById('rPassword2').value;
  msgEl.className='msg';
  if(!p1 || !p2){ msgEl.textContent=dict.errFields; msgEl.className='msg error'; return; }
  if(p1.length < 8){ msgEl.textContent=dict.errLength; msgEl.className='msg error'; return; }
  if(p1 !== p2){ msgEl.textContent=dict.errMatch; msgEl.className='msg error'; return; }
  if(!token){ msgEl.textContent=dict.errToken; msgEl.className='msg error'; return; }

  const btn = document.getElementById('btnReset');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p1})});
    const data = await r.json();
    if(!r.ok){ msgEl.textContent = data.error || dict.errToken; msgEl.className='msg error'; btn.disabled=false; return; }
    msgEl.textContent = dict.success; msgEl.className='msg success';
    setTimeout(()=>{ location.href='/login'; }, 1200);
  }catch(e){
    msgEl.textContent = 'Error: '+e.message; msgEl.className='msg error'; btn.disabled=false;
  }
});

document.getElementById('rPassword2').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('btnReset').click(); });
</script>
</body></html>
