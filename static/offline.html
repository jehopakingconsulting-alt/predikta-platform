<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hors ligne — ZYNORIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#04040f;--accent:#1479FF;--accent2:#004DFF;--gold:#ffd700;--text:#e8eeff;--muted2:#1479FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(79,110,255,.06) 0%,transparent 60%)}
.icon{font-size:3.5rem;margin-bottom:20px;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;background:linear-gradient(135deg,#1479FF,#004DFF,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:20px}
h1{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;margin-bottom:10px}
p{font-size:.84rem;color:var(--muted2);max-width:380px;line-height:1.7;margin-bottom:28px}
.btn{padding:13px 32px;border-radius:12px;font-size:.85rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(79,110,255,.35)}
.btn:hover{opacity:.85}
.status{margin-top:24px;font-size:.72rem;color:var(--muted2);padding:8px 16px;background:rgba(255,255,255,.04);border:1px solid #1a1a45;border-radius:8px}
.online{color:#22e87a}
.offline{color:#ff6644}
</style>
</head>
<body>
<div class="icon">📡</div>
<div class="logo">ZYNORIQ</div>
<h1 data-i18n="title">Vous êtes hors ligne</h1>
<p data-i18n="desc">Vérifiez votre connexion internet. Les données déjà chargées restent disponibles dans le cache.</p>
<button class="btn" onclick="tryReconnect()" data-i18n="btnRetry">Réessayer</button>
<div class="status" id="netStatus">
  <span data-i18n="checking">Vérification de la connexion...</span>
</div>
<script>
const T = {
  fr:{title:"Vous êtes hors ligne",desc:"Vérifiez votre connexion internet. Les données déjà chargées restent disponibles dans le cache.",
    btnRetry:"Réessayer",checking:"Vérification de la connexion...",
    online:"Connexion rétablie",onlineRedirect:"Redirection...",offline:"Toujours hors ligne"},
  en:{title:"You are offline",desc:"Check your internet connection. Previously loaded data is still available in the cache.",
    btnRetry:"Retry",checking:"Checking connection...",
    online:"Connection restored",onlineRedirect:"Redirecting...",offline:"Still offline"},
  es:{title:"Estás sin conexión",desc:"Verifica tu conexión a internet. Los datos ya cargados siguen disponibles en la caché.",
    btnRetry:"Reintentar",checking:"Verificando conexión...",
    online:"Conexión restablecida",onlineRedirect:"Redirigiendo...",offline:"Aún sin conexión"},
  pt:{title:"Você está offline",desc:"Verifique sua conexão com a internet. Os dados já carregados continuam disponíveis no cache.",
    btnRetry:"Tentar novamente",checking:"Verificando conexão...",
    online:"Conexão restabelecida",onlineRedirect:"Redirecionando...",offline:"Ainda offline"},
  ht:{title:"Ou pa gen entènèt",desc:"Verifye koneksyon entènèt ou. Done ki te deja chaje rete disponib nan kach la.",
    btnRetry:"Eseye ankò",checking:"Verifikasyon koneksyon...",
    online:"Koneksyon retabli",onlineRedirect:"N ap redirije...",offline:"Toujou san entènèt"},
};
let curLang = (window.PREDIKTA_LANG || localStorage.getItem('predikta_lang') || 'fr');
if(!T[curLang]) curLang='fr';
function applyLang(lang){
  curLang = T[lang]?lang:'fr';
  const dict = T[curLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[k]) el.textContent = dict[k];
  });
}
window.setLang = applyLang;
applyLang(curLang);

function updateStatus(){
  const el = document.getElementById('netStatus');
  const dict = T[curLang];
  if(navigator.onLine){
    el.innerHTML = '<span class="online">✓ ' + dict.online + '</span> — ' + dict.onlineRedirect;
    setTimeout(()=>{ window.location.href = '/'; }, 1500);
  } else {
    el.innerHTML = '<span class="offline">✗ ' + dict.offline + '</span>';
  }
}
function tryReconnect(){
  updateStatus();
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();
</script>
</body></html>
