<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Memory Center™ — ZYNORIQ</title>
<meta name="description" content="ZYNORIQ Memory Center™ — Gérez votre profil intelligent, vos préférences et votre mémoire personnalisée."/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<script src="/nav.js" defer></script>
<style>
:root{--bg:#04040f;--card:#0b0b22;--border:#1a1a45;--accent:#1479FF;--accent2:#004DFF;--gold:#ffd700;--green:#22e87a;--red:#ff3d2e;--text:#e8eeff;--muted:#4d5a8a;--muted2:#1479FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.page{max-width:960px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}
h1{font-family:'Orbitron',monospace;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;background:linear-gradient(135deg,#1479FF,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{font-size:.85rem;color:var(--muted2);margin-bottom:32px}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
.section::before{content:'';display:block;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-bottom:20px}
.section-title{font-size:.9rem;font-weight:800;color:var(--text);margin-bottom:16px}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{flex:1;min-width:120px;background:rgba(20,121,255,.08);border:1px solid rgba(20,121,255,.2);border-radius:10px;padding:14px;text-align:center}
.stat-num{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;color:var(--accent)}
.stat-label{font-size:.68rem;color:var(--muted2);margin-top:4px}
.pref-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(26,26,69,.5)}
.pref-label{font-size:.82rem;color:var(--text)}
.pref-desc{font-size:.68rem;color:var(--muted2)}
.toggle{position:relative;width:44px;height:24px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle .slider{position:absolute;inset:0;border-radius:12px;background:#1a1a45;transition:.3s}
.toggle .slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--muted);border-radius:50%;transition:.3s}
.toggle input:checked+.slider{background:var(--accent)}
.toggle input:checked+.slider::before{transform:translateX(20px);background:#fff}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{padding:4px 12px;border-radius:16px;font-size:.72rem;font-weight:600;background:rgba(20,121,255,.12);border:1px solid rgba(20,121,255,.25);color:#88aaff}
.convo-item{padding:10px 0;border-bottom:1px solid rgba(26,26,69,.4)}
.convo-q{font-size:.8rem;font-weight:600;color:var(--text)}
.convo-a{font-size:.72rem;color:var(--muted2);margin-top:4px;line-height:1.5}
.convo-meta{font-size:.62rem;color:var(--muted);margin-top:4px}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:10px 20px;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;border:1px solid var(--border);transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.btn-danger{background:rgba(255,61,46,.1);border-color:rgba(255,61,46,.3);color:var(--red)}
.btn-danger:hover{background:rgba(255,61,46,.2)}
.btn-outline{background:transparent;color:var(--muted2)}
.btn-outline:hover{border-color:var(--accent);color:var(--text)}
.rec-card{background:rgba(20,121,255,.06);border:1px solid rgba(20,121,255,.2);border-radius:10px;padding:14px;margin-bottom:10px}
.rec-title{font-size:.82rem;font-weight:700;color:var(--text)}
.rec-desc{font-size:.72rem;color:var(--muted2);margin-top:4px;line-height:1.5}
.rec-action{display:inline-block;margin-top:8px;font-size:.72rem;font-weight:700;color:var(--accent);text-decoration:none}
.empty{font-size:.8rem;color:var(--muted);text-align:center;padding:20px}
#loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:600px){.stat-row{flex-direction:column}}
</style>
</head>
<body>
<div class="page">
  <h1>🧠 Memory Center™</h1>
  <p class="subtitle" id="mc-subtitle">Votre profil intelligent — consultez, modifiez ou effacez votre mémoire ZYNORIQ.</p>

  <div id="loading" data-i18n="loading"></div>
  <div id="content" style="display:none">

    <div class="section">
      <div class="section-title" id="mc-overview"></div>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-num" id="s-visits">0</div><div class="stat-label" id="mc-lbl-visits"></div></div>
        <div class="stat-card"><div class="stat-num" id="s-convos">0</div><div class="stat-label" id="mc-lbl-convos"></div></div>
        <div class="stat-card"><div class="stat-num" id="s-analyses">0</div><div class="stat-label" id="mc-lbl-analyses"></div></div>
        <div class="stat-card"><div class="stat-num" id="s-level">—</div><div class="stat-label" id="mc-lbl-level"></div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title" id="mc-fav-title"></div>
      <div class="tag-list" id="fav-states"></div>
    </div>

    <div class="section">
      <div class="section-title" id="mc-recs-title"></div>
      <div id="recs"></div>
    </div>

    <div class="section">
      <div class="section-title" id="mc-convos-title"></div>
      <div id="convos"></div>
    </div>

    <div class="section">
      <div class="section-title" id="mc-prefs-title"></div>
      <div id="prefs"></div>
    </div>

    <div class="section">
      <div class="section-title" id="mc-data-title"></div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="exportMemory()" id="mc-export-btn"></button>
        <button class="btn btn-danger" onclick="clearMemory()" id="mc-clear-btn"></button>
      </div>
    </div>

  </div>
</div>

<script>
const MC_T = {
  fr:{loading:"Chargement...",subtitle:"Votre profil intelligent — consultez, modifiez ou effacez votre memoire ZYNORIQ.",overview:"📊 Vue d'ensemble",visits:"Visites",convos:"Conversations",analyses:"Analyses",level:"Niveau",favTitle:"⭐ Etats favoris",recsTitle:"💡 Recommandations personnalisees",convosTitle:"💬 Dernieres conversations Copilot",prefsTitle:"⚙️ Preferences de memoire",dataTitle:"🔒 Gestion des donnees",exportBtn:"📥 Exporter mes donnees",clearBtn:"🗑️ Effacer toute ma memoire",clearConfirm:"Effacer toute votre memoire ZYNORIQ ? Cette action est irreversible.",cleared:"Memoire effacee.",noFav:"Aucun Etat favori encore — commencez a analyser !",noRecs:"Pas de recommandations pour le moment.",noConvos:"Aucune conversation encore — ouvrez le Copilot !",errorLoad:"Erreur de chargement. Connectez-vous d'abord.",new:"Nouveau",active:"Actif",regular:"Regulier",power_user:"Power User",
    pref_convos:"Memoriser les conversations",pref_convos_d:"Le Copilot retient vos echanges pour des reponses contextuelles.",pref_activities:"Suivre l'activite",pref_activities_d:"Memorise les pages visitees et analyses lancees.",pref_searches:"Memoriser les recherches",pref_searches_d:"Garde un historique de vos recherches recentes.",pref_recs:"Recommandations personnalisees",pref_recs_d:"Suggestions basees sur votre utilisation.",pref_dash:"Dashboard personnalise",pref_dash_d:"Contenu adapte a chaque connexion."},
  en:{loading:"Loading...",subtitle:"Your smart profile — view, edit or clear your ZYNORIQ memory.",overview:"📊 Overview",visits:"Visits",convos:"Conversations",analyses:"Analyses",level:"Level",favTitle:"⭐ Favorite States",recsTitle:"💡 Personalized Recommendations",convosTitle:"💬 Latest Copilot Conversations",prefsTitle:"⚙️ Memory Preferences",dataTitle:"🔒 Data Management",exportBtn:"📥 Export my data",clearBtn:"🗑️ Clear all my memory",clearConfirm:"Clear all your ZYNORIQ memory? This action is irreversible.",cleared:"Memory cleared.",noFav:"No favorite states yet — start analyzing!",noRecs:"No recommendations yet.",noConvos:"No conversations yet — open the Copilot!",errorLoad:"Loading error. Please log in first.",new:"New",active:"Active",regular:"Regular",power_user:"Power User",
    pref_convos:"Remember conversations",pref_convos_d:"Copilot remembers your exchanges for contextual responses.",pref_activities:"Track activity",pref_activities_d:"Records pages visited and analyses launched.",pref_searches:"Remember searches",pref_searches_d:"Keeps a history of your recent searches.",pref_recs:"Personalized recommendations",pref_recs_d:"Suggestions based on your usage.",pref_dash:"Personalized dashboard",pref_dash_d:"Content adapted on each login."},
  es:{loading:"Cargando...",subtitle:"Su perfil inteligente — consulte, modifique o borre su memoria ZYNORIQ.",overview:"📊 Resumen",visits:"Visitas",convos:"Conversaciones",analyses:"Analisis",level:"Nivel",favTitle:"⭐ Estados favoritos",recsTitle:"💡 Recomendaciones personalizadas",convosTitle:"💬 Ultimas conversaciones Copilot",prefsTitle:"⚙️ Preferencias de memoria",dataTitle:"🔒 Gestion de datos",exportBtn:"📥 Exportar mis datos",clearBtn:"🗑️ Borrar toda mi memoria",clearConfirm:"Borrar toda su memoria ZYNORIQ? Esta accion es irreversible.",cleared:"Memoria borrada.",noFav:"Ningun Estado favorito aun — comience a analizar!",noRecs:"Sin recomendaciones por ahora.",noConvos:"Sin conversaciones aun — abra el Copilot!",errorLoad:"Error de carga. Inicie sesion primero.",new:"Nuevo",active:"Activo",regular:"Regular",power_user:"Power User",
    pref_convos:"Memorizar conversaciones",pref_convos_d:"El Copilot retiene sus intercambios.",pref_activities:"Seguir actividad",pref_activities_d:"Memoriza paginas visitadas y analisis.",pref_searches:"Memorizar busquedas",pref_searches_d:"Guarda historial de busquedas.",pref_recs:"Recomendaciones personalizadas",pref_recs_d:"Sugerencias basadas en su uso.",pref_dash:"Dashboard personalizado",pref_dash_d:"Contenido adaptado en cada conexion."},
  pt:{loading:"Carregando...",subtitle:"Seu perfil inteligente — consulte, modifique ou apague sua memoria ZYNORIQ.",overview:"📊 Visao geral",visits:"Visitas",convos:"Conversas",analyses:"Analises",level:"Nivel",favTitle:"⭐ Estados favoritos",recsTitle:"💡 Recomendacoes personalizadas",convosTitle:"💬 Ultimas conversas Copilot",prefsTitle:"⚙️ Preferencias de memoria",dataTitle:"🔒 Gestao de dados",exportBtn:"📥 Exportar meus dados",clearBtn:"🗑️ Apagar toda minha memoria",clearConfirm:"Apagar toda sua memoria ZYNORIQ? Esta acao e irreversivel.",cleared:"Memoria apagada.",noFav:"Nenhum Estado favorito ainda — comece a analisar!",noRecs:"Sem recomendacoes por enquanto.",noConvos:"Nenhuma conversa ainda — abra o Copilot!",errorLoad:"Erro de carregamento. Faca login primeiro.",new:"Novo",active:"Ativo",regular:"Regular",power_user:"Power User",
    pref_convos:"Memorizar conversas",pref_convos_d:"O Copilot retém suas trocas.",pref_activities:"Rastrear atividade",pref_activities_d:"Memoriza paginas visitadas.",pref_searches:"Memorizar buscas",pref_searches_d:"Guarda historico de buscas.",pref_recs:"Recomendacoes personalizadas",pref_recs_d:"Sugestoes baseadas no seu uso.",pref_dash:"Dashboard personalizado",pref_dash_d:"Conteudo adaptado a cada login."},
  ht:{loading:"Chajman...",subtitle:"Pwofil entelijan ou — konsilte, modifye oswa efase memwa ZYNORIQ ou.",overview:"📊 Apesi jeneral",visits:"Vizit",convos:"Konvesasyon",analyses:"Analiz",level:"Nivo",favTitle:"⭐ Eta prefere",recsTitle:"💡 Rekomandasyon pèsonalize",convosTitle:"💬 Dènye konvesasyon Copilot",prefsTitle:"⚙️ Preferans memwa",dataTitle:"🔒 Jesyon done",exportBtn:"📥 Ekspòte done mwen",clearBtn:"🗑️ Efase tout memwa mwen",clearConfirm:"Efase tout memwa ZYNORIQ ou? Aksyon sa a pa ka defèt.",cleared:"Memwa efase.",noFav:"Pa gen Eta prefere anko — kòmanse analize!",noRecs:"Pa gen rekòmandasyon pou kounya.",noConvos:"Pa gen konvesasyon anko — ouvri Copilot la!",errorLoad:"Erè chajman. Konekte anvan.",new:"Nouvo",active:"Aktif",regular:"Regilye",power_user:"Power User",
    pref_convos:"Memorize konvesasyon",pref_convos_d:"Copilot kenbe echanj ou yo.",pref_activities:"Swiv aktivite",pref_activities_d:"Memorize paj vizite yo.",pref_searches:"Memorize rechèch",pref_searches_d:"Kenbe istwa rechèch ou.",pref_recs:"Rekomandasyon pèsonalize",pref_recs_d:"Sijesyon baze sou itilizasyon ou.",pref_dash:"Dashboard pèsonalize",pref_dash_d:"Kontni adapte a chak koneksyon."},
};
function mct(k){return (MC_T[window.PREDIKTA_LANG]||MC_T.en)[k]||MC_T.en[k]||k;}

function applyMemLang(){
  document.getElementById('loading').textContent = mct('loading');
  document.getElementById('mc-subtitle').textContent = mct('subtitle');
  document.getElementById('mc-overview').textContent = mct('overview');
  document.getElementById('mc-lbl-visits').textContent = mct('visits');
  document.getElementById('mc-lbl-convos').textContent = mct('convos');
  document.getElementById('mc-lbl-analyses').textContent = mct('analyses');
  document.getElementById('mc-lbl-level').textContent = mct('level');
  document.getElementById('mc-fav-title').textContent = mct('favTitle');
  document.getElementById('mc-recs-title').textContent = mct('recsTitle');
  document.getElementById('mc-convos-title').textContent = mct('convosTitle');
  document.getElementById('mc-prefs-title').textContent = mct('prefsTitle');
  document.getElementById('mc-data-title').textContent = mct('dataTitle');
  document.getElementById('mc-export-btn').textContent = mct('exportBtn');
  document.getElementById('mc-clear-btn').textContent = mct('clearBtn');
}
applyMemLang();
window.setLang = function(l){ window.PREDIKTA_LANG = l; applyMemLang(); loadMemory(); };

const PREF_LABELS = {
  track_conversations: {label:()=>mct('pref_convos'), desc:()=>mct('pref_convos_d')},
  track_activities: {label:()=>mct('pref_activities'), desc:()=>mct('pref_activities_d')},
  track_searches: {label:()=>mct('pref_searches'), desc:()=>mct('pref_searches_d')},
  personalized_recommendations: {label:()=>mct('pref_recs'), desc:()=>mct('pref_recs_d')},
  personalized_dashboard: {label:()=>mct('pref_dash'), desc:()=>mct('pref_dash_d')},
};

async function loadMemory(){
  try{
    const [profR, convR, recR] = await Promise.all([
      fetch('/api/memory/profile').then(r=>r.json()),
      fetch('/api/memory/conversations?limit=10').then(r=>r.json()),
      fetch('/api/memory/recommendations').then(r=>r.json()),
    ]);

    const profile = profR.profile || {};
    const convos = convR.conversations || [];
    const recs = recR.recommendations || [];

    // Stats
    document.getElementById('s-visits').textContent = profile.visit_count || 0;
    document.getElementById('s-convos').textContent = convos.length;
    document.getElementById('s-analyses').textContent = (profile.recent_analyses||[]).length;
    document.getElementById('s-level').textContent = mct(profile.usage_frequency || 'new');

    // Favorite states
    const favEl = document.getElementById('fav-states');
    const favs = profile.favorite_states || [];
    favEl.innerHTML = favs.length ? favs.map(s=>`<span class="tag">${s}</span>`).join('') : `<div class="empty">${mct('noFav')}</div>`;

    // Recommendations
    const recsEl = document.getElementById('recs');
    recsEl.innerHTML = recs.length ? recs.map(r=>`
      <div class="rec-card">
        <div class="rec-title">${r.title}</div>
        <div class="rec-desc">${r.description}</div>
        <a href="${r.action}" class="rec-action">→ ${r.title}</a>
      </div>
    `).join('') : `<div class="empty">${mct('noRecs')}</div>`;

    // Conversations
    const convEl = document.getElementById('convos');
    convEl.innerHTML = convos.length ? convos.slice(-10).map(c=>`
      <div class="convo-item">
        <div class="convo-q">❓ ${c.question}</div>
        <div class="convo-a">${(c.answer||'').substring(0,200)}${c.answer?.length>200?'...':''}</div>
        <div class="convo-meta">${c.mode} · ${c.page} · ${c.ts?.split('T')[0]||''}</div>
      </div>
    `).join('') : `<div class="empty">${mct('noConvos')}</div>`;

    // Preferences
    const prefsR = await fetch('/api/memory/preferences').then(r=>r.json());
    const prefs = prefsR.preferences || {};
    const prefsEl = document.getElementById('prefs');
    prefsEl.innerHTML = Object.entries(PREF_LABELS).map(([k,v])=>`
      <div class="pref-row">
        <div><div class="pref-label">${v.label()}</div><div class="pref-desc">${v.desc()}</div></div>
        <label class="toggle"><input type="checkbox" ${prefs[k]!==false?'checked':''} onchange="togglePref('${k}',this.checked)"/><span class="slider"></span></label>
      </div>
    `).join('');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
  } catch(e){
    document.getElementById('loading').textContent = mct('errorLoad');
  }
}

async function togglePref(key, val){
  const body = {};
  body[key] = val;
  await fetch('/api/memory/preferences', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
}

async function exportMemory(){
  const r = await fetch('/api/memory/export');
  const data = await r.json();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'zynoriq_memory_export.json';
  a.click(); URL.revokeObjectURL(url);
}

async function clearMemory(){
  if(!confirm(mct('clearConfirm'))) return;
  await fetch('/api/memory/clear', {method:'POST'});
  alert(mct('cleared'));
  location.reload();
}

loadMemory();
</script>
</body></html>
