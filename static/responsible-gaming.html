fr:{ title:"Jeu Responsable", updated:"Dernière mise à jour : 14 juin 2026",

 body:`
<h2>1. Notre engagement</h2>
<p>ZYNORIQ est avant tout une plateforme d'<strong>analyse statistique et d'aide à la décision</strong>. Nous croyons que la donnée et la transparence rendent le jeu plus intelligent — mais jamais sans risque. Notre priorité est que chaque utilisateur comprenne la nature aléatoire des loteries avant d'y jouer.</p>

<h2>2. Aucune garantie de gain</h2>
<p>Toutes les prédictions, suggestions, scores de confiance et « tendances statistiques » affichés sur ZYNORIQ sont calculés à partir de données historiques publiques. <strong>Ils ne prédisent pas l'avenir.</strong> Chaque tirage de loterie est un événement aléatoire et indépendant : la probabilité de gagner reste la même, peu importe ce qu'indique notre algorithme (environ 1 chance sur 1 000 pour un Pick 3 en exact, ~1 sur 167 en groupé). Voir notre <a href="/track-record">historique de performance</a> et notre <a href="/faq">FAQ</a> pour le détail.</p>

<h2>3. Non-affiliation</h2>
<p>ZYNORIQ <strong>n'est pas une loterie officielle</strong> et n'est <strong>affilié à aucune société de loterie gouvernementale ou étatique</strong> (New York Lottery, Florida Lottery, etc.). Nous utilisons uniquement des résultats publics, déjà publiés par ces organismes, à des fins d'analyse statistique.</p>

<h2>4. Âge légal</h2>
<p>ZYNORIQ est <strong>réservé aux personnes ayant l'âge légal pour jouer à la loterie dans leur juridiction</strong> (généralement 18 ans, parfois 21 selon l'État ou le pays). Si vous êtes mineur, n'utilisez pas ce service pour acheter des billets de loterie.</p>

<h2>5. Conseils pour jouer de manière responsable</h2>
<ul>
  <li><strong>Fixez un budget avant de jouer</strong> et ne le dépassez jamais, même après une perte.</li>
  <li><strong>Fixez une limite de temps</strong> pour vos sessions de jeu et respectez-la.</li>
  <li>Ne jouez jamais pour « se refaire » après une perte (chasing losses).</li>
  <li>Ne considérez jamais la loterie comme une source de revenu ou un plan financier.</li>
  <li>Ne jouez pas sous l'effet de l'alcool, de stress intense ou de problèmes émotionnels.</li>
  <li>Faites des pauses régulières — utilisez les outils d'auto-exclusion proposés par votre loterie locale si besoin.</li>
  <li>Parlez-en à un proche si le jeu commence à occuper une place importante dans votre vie ou vos finances.</li>
</ul>

<div class="tip-box">
  💡 <strong>Signes d'alerte :</strong> jouer plus que prévu, emprunter de l'argent pour jouer, mentir sur ses habitudes de jeu, ressentir de l'anxiété à l'idée de ne pas jouer. Si vous reconnaissez ces signes, contactez l'une des ressources ci-dessous.
</div>

<h2>6. Limites de budget et de temps</h2>
<p>Avant chaque session, posez-vous ces deux questions : <strong>« Combien suis-je prêt(e) à perdre aujourd'hui sans que cela affecte mes finances ? »</strong> et <strong>« Combien de temps vais-je consacrer à cela ? »</strong> Notez ces deux limites, et arrêtez-vous dès qu'une des deux est atteinte — gain ou perte. De nombreuses loteries d'État proposent des outils gratuits de définition de limites et d'auto-exclusion sur leurs sites officiels.</p>

<h2>7. Besoin d'aide ? Ressources gratuites et confidentielles</h2>
<div class="helpline"><strong>États-Unis :</strong> National Problem Gambling Helpline — <strong>1-800-GAMBLER</strong> (1-800-426-2537) · <a href="https://www.ncpgambling.org" target="_blank">ncpgambling.org</a></div>
<div class="helpline"><strong>Canada :</strong> ConnexOntario — <strong>1-866-531-2600</strong> · <a href="https://www.connexontario.ca" target="_blank">connexontario.ca</a></div>
<div class="helpline"><strong>France :</strong> Joueurs Info Service — <strong>09 74 75 13 13</strong> (gratuit, 24h/24) · <a href="https://www.joueurs-info-service.fr" target="_blank">joueurs-info-service.fr</a></div>
<div class="helpline"><strong>International :</strong> <a href="https://www.gamblersanonymous.org" target="_blank">Gamblers Anonymous — gamblersanonymous.org</a> (groupes dans de nombreux pays)</div>

<h2>8. Vérification d'identité et restriction</h2>
<p>ZYNORIQ ne vend pas de billets de loterie et ne traite aucun paiement de jeu. Cependant, si vous estimez avoir besoin de vous protéger contre vos propres habitudes de jeu, vous pouvez nous contacter pour demander la <strong>fermeture de votre compte ZYNORIQ</strong> à tout moment via la page <a href="/contact">Contact</a>.</p>

<h2>9. Contact</h2>
<p>Pour toute question relative au jeu responsable ou à ces informations : <a href="/contact">formulaire de contact</a> ou <a href="mailto:legal@zynoriq.com">legal@zynoriq.com</a></p>` },

en:{ title:"Responsible Gaming", updated:"Last updated: June 14, 2026",
 warning:"⚠️ <strong>Important:</strong> Lotteries are games of chance. ZYNORIQ provides educational, experimental statistical analysis — it does not guarantee any winnings. Only play with money you can afford to lose.",
 body:`
<h2>1. Our commitment</h2>
<p>ZYNORIQ is first and foremost a <strong>statistical analysis and decision-support platform</strong>. We believe data and transparency make play smarter — but never risk-free. Our priority is that every user understands the random nature of lotteries before playing.</p>

<h2>2. No guarantee of winnings</h2>
<p>All predictions, suggestions, confidence scores and "statistical trends" shown on ZYNORIQ are computed from public historical data. <strong>They do not predict the future.</strong> Every lottery draw is a random, independent event: your odds of winning stay the same no matter what our algorithm shows (roughly 1 in 1,000 for an exact Pick 3 match, ~1 in 167 for a box match). See our <a href="/track-record">performance track record</a> and <a href="/faq">FAQ</a> for details.</p>

<h2>3. No affiliation</h2>
<p>ZYNORIQ is <strong>not an official lottery</strong> and is <strong>not affiliated with any government or state lottery organization</strong> (New York Lottery, Florida Lottery, etc.). We only use public results already published by those organizations, for statistical analysis purposes.</p>

<h2>4. Legal age</h2>
<p>ZYNORIQ is <strong>restricted to people who are of legal age to play the lottery in their jurisdiction</strong> (usually 18, sometimes 21 depending on the state or country). If you are a minor, do not use this service to purchase lottery tickets.</p>

<h2>5. Tips for playing responsibly</h2>
<ul>
  <li><strong>Set a budget before you play</strong> and never exceed it, even after a loss.</li>
  <li><strong>Set a time limit</strong> for your play sessions and stick to it.</li>
  <li>Never play to "chase" a previous loss.</li>
  <li>Never treat the lottery as a source of income or a financial plan.</li>
  <li>Don't play while under the influence of alcohol, intense stress, or emotional distress.</li>
  <li>Take regular breaks — use self-exclusion tools offered by your local lottery if needed.</li>
  <li>Talk to someone you trust if gambling starts taking up a large place in your life or finances.</li>
</ul>

<div class="tip-box">
  💡 <strong>Warning signs:</strong> playing more than planned, borrowing money to play, lying about your gambling habits, feeling anxious when not playing. If you recognize these signs, contact one of the resources below.
</div>

<h2>6. Budget and time limits</h2>
<p>Before each session, ask yourself two questions: <strong>"How much am I willing to lose today without it affecting my finances?"</strong> and <strong>"How much time will I spend on this?"</strong> Write down both limits and stop as soon as either is reached — win or lose. Many state lotteries offer free limit-setting and self-exclusion tools on their official websites.</p>

<h2>7. Need help? Free and confidential resources</h2>
<div class="helpline"><strong>United States:</strong> National Problem Gambling Helpline — <strong>1-800-GAMBLER</strong> (1-800-426-2537) · <a href="https://www.ncpgambling.org" target="_blank">ncpgambling.org</a></div>
<div class="helpline"><strong>Canada:</strong> ConnexOntario — <strong>1-866-531-2600</strong> · <a href="https://www.connexontario.ca" target="_blank">connexontario.ca</a></div>
<div class="helpline"><strong>UK:</strong> GamCare — <strong>0808 8020 133</strong> · <a href="https://www.gamcare.org.uk" target="_blank">gamcare.org.uk</a></div>
<div class="helpline"><strong>International:</strong> <a href="https://www.gamblersanonymous.org" target="_blank">Gamblers Anonymous — gamblersanonymous.org</a> (groups in many countries)</div>

<h2>8. Identity verification and restriction</h2>
<p>ZYNORIQ does not sell lottery tickets and does not process any gambling payments. However, if you feel you need to protect yourself from your own gambling habits, you can contact us to request the <strong>closure of your ZYNORIQ account</strong> at any time via the <a href="/contact">Contact</a> page.</p>

<h2>9. Contact</h2>
<p>For any question about responsible gaming or this information: <a href="/contact">contact form</a> or <a href="mailto:legal@zynoriq.com">legal@zynoriq.com</a></p>` },
