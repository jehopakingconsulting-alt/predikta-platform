<style>
/* ══════════════════════════════════════════
   ZYNORIQ — Results Hub
   ══════════════════════════════════════════ */
:root{
  --bg:#04040f; --bg2:#07071a; --card:#0b0b22; --card2:#0e0e2a;
  --border:#1a1a45; --border2:#252560;
  --accent:#1479FF; --accent2:#004DFF;
  --gold:#ffd700; --gold2:#ffaa00;
  --green:#22e87a; --red:#ff3d2e;
  --text:#e8eeff; --muted:#4d5a8a; --muted2:#1479FF;
  --glass:rgba(255,255,255,.03); --glass2:rgba(255,255,255,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 20%,rgba(79,110,255,.07) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 70%,rgba(136,85,255,.06) 0%,transparent 60%);
}

/* ── Header ── */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(4,4,15,.97);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
}
.header-inner{
  max-width:1400px;margin:0 auto;
  display:flex;align-items:center;gap:16px;padding:12px 28px;
  flex-wrap:wrap;
}
.logo-link{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-svg{width:36px;height:36px}
.logo-name{
  font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#1479FF,#004DFF,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-links{display:flex;gap:6px;margin-left:12px}
.nav-link{
  padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:600;
  text-decoration:none;color:var(--muted2);border:1px solid transparent;transition:all .2s;
}
.nav-link:hover{color:var(--text);border-color:var(--border2)}
.nav-link.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Lang */
.lang-switcher{display:flex;gap:3px;margin-left:auto}
.lang-btn{
  padding:4px 9px;border-radius:6px;font-size:.68rem;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted2);
}
.lang-btn.active,.lang-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Page layout ── */
.page{max-width:1400px;margin:0 auto;padding:24px 28px;position:relative;z-index:5}

/* ── Search hero ── */
.search-hero{
  text-align:center;padding:32px 20px 24px;
  background:linear-gradient(180deg,rgba(10,10,30,.6),transparent);
  border-radius:16px;margin-bottom:28px;
}
.search-title{
  font-family:'Orbitron',monospace;font-size:clamp(1.2rem,3vw,1.8rem);font-weight:900;
  background:linear-gradient(135deg,#6688ff,#aa66ff,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:6px;
}
.search-sub{font-size:.82rem;color:var(--muted2);margin-bottom:20px;letter-spacing:.5px}
.search-wrap{
  max-width:600px;margin:0 auto;position:relative;
}
.search-input{
  width:100%;padding:14px 50px 14px 20px;
  border-radius:50px;border:1px solid var(--border2);
  background:rgba(12,12,40,.9);color:var(--text);
  font-size:1rem;font-family:'Inter',sans-serif;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,255,.15)}
.search-input::placeholder{color:var(--muted)}
.search-icon{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:1.1rem;color:var(--muted);pointer-events:none;
}
.search-clear{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:1rem;color:var(--muted);cursor:pointer;display:none;
}
.quick-filters{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.qf-btn{
  padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:600;
  cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted2);
  transition:all .2s;
}
.qf-btn:hover,.qf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── Live ticker ── */
.live-ticker{
  display:flex;align-items:center;gap:10px;
  background:rgba(34,232,122,.07);border:1px solid rgba(34,232,122,.25);
  border-radius:10px;padding:10px 16px;margin-bottom:20px;
  font-size:.78rem;
}
.live-dot{
  width:8px;height:8px;border-radius:50%;background:#22e87a;
  animation:livePulse 1.5s ease-in-out infinite;flex-shrink:0;
}
@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,232,122,.4)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(34,232,122,0)}}
@keyframes _ctaPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}60%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
.live-text{color:#22e87a;font-weight:700;flex-shrink:0}
.live-scroll{flex:1;overflow:hidden;white-space:nowrap}
.live-scroll span{color:var(--muted2)}
.live-scroll strong{color:var(--text)}
.live-time{color:var(--muted);font-size:.7rem;flex-shrink:0}

/* ── Section header ── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;flex-wrap:wrap;gap:8px;
}
.section-title{font-size:.78rem;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:2px}
.section-count{font-size:.7rem;color:var(--muted);padding:3px 10px;background:var(--glass2);border-radius:10px;border:1px solid var(--border)}

/* ── State Grid ── */
.states-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
}
.state-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  position:relative;
}
.state-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 30px rgba(79,110,255,.2)}
.state-card.no-data{opacity:.5;cursor:default}
.state-card.no-data:hover{transform:none;border-color:var(--border);box-shadow:none}

/* Today badge */
.today-badge{
  position:absolute;top:10px;right:10px;
  padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700;letter-spacing:.5px;
  background:rgba(34,232,122,.2);color:#22e87a;border:1px solid rgba(34,232,122,.4);
}
.yesterday-badge{
  position:absolute;top:10px;right:10px;
  padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700;
  background:rgba(255,215,0,.15);color:var(--gold);border:1px solid rgba(255,215,0,.3);
}
.nodata-badge{
  position:absolute;top:10px;right:10px;
  padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700;
  background:rgba(255,61,46,.15);color:#ff6655;border:1px solid rgba(255,61,46,.3);
}

.card-head{
  padding:14px 14px 8px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.card-flag{font-size:1.6rem;flex-shrink:0}
.card-state-info{}
.card-state-name{font-size:.82rem;font-weight:700;color:var(--text);line-height:1.2}
.card-game-name{font-size:.65rem;color:var(--muted2);margin-top:1px}
.card-body{padding:12px 14px}
.card-date{font-size:.68rem;color:var(--muted2);margin-bottom:8px}

/* Draw rows */
.draw-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.draw-row:last-child{margin-bottom:0}
.draw-tod{
  font-size:.6rem;font-weight:700;color:var(--muted2);
  width:50px;flex-shrink:0;text-align:right;
}
.draw-balls{display:flex;gap:4px}
.dball{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.82rem;font-weight:800;border:2px solid;
  transition:transform .2s;
}
.dball:hover{transform:scale(1.15)}
.draw-time{font-size:.58rem;color:var(--muted);margin-left:4px;flex-shrink:0}

.card-footer{
  padding:8px 14px 10px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-schedule{font-size:.6rem;color:var(--muted)}
.card-view-btn{
  font-size:.65rem;font-weight:700;color:var(--accent);
  cursor:pointer;padding:3px 10px;border:1px solid rgba(79,110,255,.3);
  border-radius:6px;transition:all .2s;background:transparent;
}
.card-view-btn:hover{background:rgba(79,110,255,.15)}

/* ── Detail Panel (slide-in) ── */
.detail-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
  display:none;backdrop-filter:blur(4px);
}
.detail-overlay.open{display:block}
.detail-panel{
  position:fixed;top:0;right:0;width:min(600px,100vw);height:100vh;
  background:#07071e;border-left:1px solid var(--border2);
  z-index:201;overflow-y:auto;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.detail-panel.open{transform:translateX(0)}

.detail-header{
  position:sticky;top:0;background:#07071e;
  border-bottom:1px solid var(--border);
  padding:16px 20px;display:flex;align-items:center;gap:12px;z-index:10;
}
.detail-close{
  width:32px;height:32px;border-radius:50%;background:var(--glass2);
  border:1px solid var(--border2);cursor:pointer;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s;
}
.detail-close:hover{background:rgba(255,61,46,.2)}
.detail-flag{font-size:2rem;flex-shrink:0}
.detail-title{flex:1}
.detail-state-name{font-size:1rem;font-weight:700;color:var(--text)}
.detail-game-name{font-size:.72rem;color:var(--muted2);margin-top:2px}
.detail-scrape-btn{
  padding:7px 14px;border-radius:8px;font-size:.72rem;font-weight:700;
  background:linear-gradient(135deg,#0a2218,#1a4a30);
  color:#44ff99;border:1px solid #226633;cursor:pointer;transition:opacity .2s;flex-shrink:0;
}
.detail-scrape-btn:hover{opacity:.8}

/* Month nav */
.month-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;background:rgba(10,10,30,.5);
  border-bottom:1px solid var(--border);
}
.month-nav-btn{
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border2);background:transparent;
  color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.month-nav-btn:hover{background:var(--accent);border-color:var(--accent)}
.month-nav-btn:disabled{opacity:.3;cursor:default}
.month-label{font-family:'Orbitron',monospace;font-size:.9rem;color:var(--gold);font-weight:700}
.month-draws-count{font-size:.7rem;color:var(--muted2)}

/* Schedule strip */
.schedule-strip{
  display:flex;gap:8px;padding:10px 20px;
  background:rgba(79,110,255,.05);border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.sched-item{
  display:flex;align-items:center;gap:6px;font-size:.7rem;
  background:var(--glass2);border:1px solid var(--border);
  border-radius:8px;padding:4px 10px;color:var(--muted2);
}
.sched-tod{font-weight:700;color:var(--text)}
.sched-time{color:var(--accent)}

/* Day cards in detail */
.detail-content{padding:16px 20px}
.day-block{
  margin-bottom:16px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
}
.day-block-head{
  padding:10px 14px;background:rgba(10,10,30,.5);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.day-name{font-size:.82rem;font-weight:700;color:var(--text)}
.day-date{font-size:.68rem;color:var(--muted2)}
.day-today-tag{
  padding:1px 8px;border-radius:6px;font-size:.6rem;font-weight:700;
  background:rgba(34,232,122,.2);color:#22e87a;border:1px solid rgba(34,232,122,.4);
}
.day-draws{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.detail-draw-row{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid var(--border);
}
.detail-tod{
  font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:6px;
  flex-shrink:0;min-width:70px;text-align:center;
}
.tod-midday{background:rgba(255,180,0,.15);color:#ffcc44;border:1px solid rgba(255,180,0,.3)}
.tod-evening{background:rgba(79,110,255,.15);color:#88aaff;border:1px solid rgba(79,110,255,.3)}
.tod-morning{background:rgba(255,100,50,.15);color:#ff9966;border:1px solid rgba(255,100,50,.3)}
.tod-night{background:rgba(136,85,255,.15);color:#bb88ff;border:1px solid rgba(136,85,255,.3)}
.tod-day{background:rgba(34,200,150,.15);color:#44ddaa;border:1px solid rgba(34,200,150,.3)}
.detail-balls{display:flex;gap:6px;flex:1}
.detail-ball{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;font-weight:800;border:2px solid;
}
.detail-sum{
  font-size:.7rem;color:var(--muted2);flex-shrink:0;
  padding:3px 8px;background:var(--glass2);border-radius:6px;
}
.detail-share{
  font-size:.75rem;cursor:pointer;color:var(--muted);transition:color .2s;flex-shrink:0;
}
.detail-share:hover{color:var(--accent)}

/* No data state */
.no-data-msg{
  text-align:center;padding:40px 20px;color:var(--muted2);
}
.no-data-msg .nd-icon{font-size:2.5rem;margin-bottom:10px}
.no-data-msg p{font-size:.82rem;margin-bottom:14px}

/* Loading */
.spinner{
  width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:4px 12px;border-radius:16px;font-size:.7rem;background:var(--glass2);border:1px solid var(--border2);color:var(--muted2)}
.chip strong{color:var(--gold)}

/* Footer */
footer{
  background:var(--bg2);border-top:1px solid var(--border);
  padding:20px 28px;text-align:center;margin-top:40px;position:relative;z-index:5;
}
.footer-logo{font-family:'Orbitron',monospace;font-size:.9rem;font-weight:900;background:linear-gradient(135deg,#1479FF,#004DFF,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.footer-copy{font-size:.62rem;color:var(--muted)}

/* Comments */
.comments-section{padding:0 20px 24px;border-top:1px solid var(--border);margin-top:8px}
.comments-title{font-size:.85rem;font-weight:800;color:var(--text);margin:18px 0 10px}
.comment-form{display:flex;gap:8px;margin-bottom:14px}
.comment-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid var(--border2);background:var(--glass2);color:var(--text);font-size:.82rem;resize:none;font-family:inherit}
.comment-input::placeholder{color:var(--muted)}
.comment-send{padding:10px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:.8rem;cursor:pointer;white-space:nowrap}
.comment-send:disabled{opacity:.5;cursor:default}
.comment-login{padding:14px;text-align:center;background:var(--glass2);border:1px solid var(--border2);border-radius:10px;font-size:.82rem;color:var(--muted2);margin-bottom:14px}
.comment-login a{color:var(--accent);font-weight:700;text-decoration:none}
.comment-list{display:flex;flex-direction:column;gap:10px}
.comment-item{background:var(--glass2);border:1px solid var(--border2);border-radius:10px;padding:10px 14px}
.comment-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.comment-author{font-weight:700;font-size:.78rem;color:var(--text)}
.comment-date{font-size:.66rem;color:var(--muted)}
.comment-body{font-size:.8rem;color:var(--muted2);line-height:1.4;white-space:pre-wrap;word-break:break-word}
.comment-delete{font-size:.68rem;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
.comment-delete:hover{color:#ff5566}
.comments-empty{text-align:center;color:var(--muted);font-size:.8rem;padding:14px}

/* Responsive */
@media(max-width:600px){
  .page{padding:16px}
  .header-inner{padding:10px 16px}
  .states-grid{grid-template-columns:1fr 1fr}
  .detail-panel{width:100vw}
}
@media(max-width:400px){
  .states-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<script src="/nav.js"></script>
<script src="/pwa-prompt.js" defer></script>
<!-- header injecté par nav.js -->

<div class="page">

  <!-- Search Hero -->
  <div class="search-hero">
    <div class="search-title" id="srTitle">Résultats des Loteries USA</div>
    <div class="search-sub" id="srSub">Cash3 · Pick3 · Daily3 · 30 États · Mis à jour quotidiennement</div>
    <div class="search-wrap">
      <input class="search-input" id="searchInput" type="text"
        placeholder="Rechercher un État... ex: New York, Texas, Florida"
        oninput="filterStates(this.value)" autocomplete="off"/>
      <span class="search-icon" id="searchIcon">🔍</span>
      <span class="search-clear" id="searchClear" onclick="clearSearch()">✕</span>
    </div>
    <div class="quick-filters" id="quickFilters">
      <button class="qf-btn active" onclick="quickFilter('all',this)">Tous les États</button>
      <button class="qf-btn" onclick="quickFilter('hasData',this)">✅ Données dispo</button>
      <button class="qf-btn" onclick="quickFilter('today',this)">🟢 Résultats d'aujourd'hui</button>
      <button class="qf-btn" onclick="quickFilter('south',this)">🌴 Sud</button>
      <button class="qf-btn" onclick="quickFilter('northeast',this)">🗽 Nord-Est</button>
      <button class="qf-btn" id="pushBtn" onclick="togglePushNotif()" title="Recevoir une notif dès qu'un tirage tombe">🔔 Alertes</button>
    </div>
  </div>

  <!-- Live ticker -->
  <div class="live-ticker" id="liveTicker">
    <div class="live-dot"></div>
    <span class="live-text">LIVE</span>
    <div class="live-scroll" id="liveScroll">Chargement des derniers résultats...</div>
    <span class="live-time" id="liveTime"></span>
  </div>

  <!-- State grid -->
  <div class="section-header">
    <div class="section-title" id="gridTitle">Tous les États</div>
    <div class="section-count" id="gridCount">Chargement...</div>
  </div>
  <div class="states-grid" id="statesGrid">
    <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted2)">
      <div class="spinner"></div>
    </div>
  </div>

</div>

<!-- Detail Panel Overlay -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>

<!-- Detail Panel -->
<div class="detail-panel" id="detailPanel">
  <div class="detail-header" id="detailHeader">

let LANG = (window.PREDIKTA_LANG && LANGS[window.PREDIKTA_LANG]) ? window.PREDIKTA_LANG : 'fr';
function t(k){ return (LANGS[LANG]||LANGS.fr)[k] || k; }
function setLang(l){
  LANG = (LANGS[l]) ? l : 'fr';
  document.documentElement.setAttribute('data-lang', LANG);
  const srTitle = document.getElementById('srTitle');
  const srSub   = document.getElementById('srSub');
  const srInput = document.getElementById('searchInput');
  const gridTit = document.getElementById('gridTitle');
  if(srTitle) srTitle.textContent = t('title');
  if(srSub)   srSub.textContent   = t('sub');
  if(srInput) srInput.placeholder = t('search');
  if(gridTit) gridTit.textContent = t('gridTitle');
  if(window._allData) renderGrid(window._allData);
}
window.setLang = setLang;

// ══════════════════════════════════════
// BALL COLORS
// ══════════════════════════════════════
const BC = ['#ff4444','#ff7722','#ffcc22','#88cc22','#22cc66','#22ccbb','#2288ff','#7744ff','#cc44ff','#ff44aa'];
function bc(n){ return BC[parseInt(n)%10]; }

function ballsHtml(draws, size=28){
  return draws.map(d=>{
    const nums = [d.d1, d.d2, d.d3];
    const balls = nums.map(n=>
      `<div class="dball" style="width:${size}px;height:${size}px;background:${bc(n)}22;border-color:${bc(n)};color:${bc(n)};font-size:${size*.38}px">${n}</div>`
    ).join('');
    const todClass = d.tod==='Midday'?'tod-midday':d.tod==='Evening'?'tod-evening':d.tod==='Morning'?'tod-morning':d.tod==='Night'?'tod-night':'tod-day';
    return `<div class="draw-row">
      <span class="draw-tod">${d.tod?t('tod_'+d.tod):''}</span>
      <div class="draw-balls">${balls}</div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════
// MAIN DATA LOAD
// ══════════════════════════════════════
let _statesData = null;
let _activeFilter = 'all';
const REGION = {
  south:   ['FL','GA','TX','LA','MS','SC','NC','TN','AR','OK'],
  northeast:['NY','NJ','CT','MA','PA','RI','DE','MD','VT','NH','ME'],
};

async function loadAll(){
  try{
    const r = await fetch('/api/results/latest');
    _statesData = await r.json();
    window._allData = _statesData;
    updateLiveTicker(_statesData);
    renderGrid(_statesData);
  } catch(e){
    document.getElementById('statesGrid').innerHTML =
      `<div style="grid-column:1/-1;text-align:center;color:#ff5533;padding:40px">Erreur de chargement. Vérifiez que le serveur est démarré.</div>`;
  }
}

function updateLiveTicker(data){
  const now = new Date();
  document.getElementById('liveTime').textContent =
    now.toLocaleTimeString(LANG==='en'?'en-US':'fr-FR', {hour:'2-digit',minute:'2-digit'});

  const today = Object.entries(data)
    .filter(([,v])=>v.is_today && v.has_data)
    .map(([code,v])=>{
      const ld = v.latest[0];
      if(!ld) return null;
      return `<strong>${v.flag} ${code}</strong>: <strong>${ld.d1}-${ld.d2}-${ld.d3}</strong>`;
    }).filter(Boolean).slice(0,8).join(' &nbsp;·&nbsp; ');

  document.getElementById('liveScroll').innerHTML = today ||
    '<span>Cliquez sur 🔄 Mettre à jour pour charger les résultats du jour</span>';
}

function renderGrid(data, filterFn=null){
  const grid = document.getElementById('statesGrid');
  const entries = Object.entries(data);

  let filtered = entries;
  if(filterFn) filtered = entries.filter(([code,v])=>filterFn(code,v));

  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if(query){
    filtered = filtered.filter(([code,v])=>
      code.toLowerCase().includes(query) ||
      v.name.toLowerCase().includes(query) ||
      getStateLongName(code).toLowerCase().includes(query)
    );
  }

  document.getElementById('gridCount').textContent = `${filtered.length} États`;
  document.getElementById('gridTitle').textContent = t('gridTitle');

  if(!filtered.length){
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted2)">Aucun État trouvé pour "${query}"</div>`;
    return;
  }

  grid.innerHTML = filtered.map(([code,v])=>renderStateCard(code,v)).join('');
}

function renderStateCard(code, v){
  if(!v.has_data){
    return `<div class="state-card no-data" onclick="openDetail('${code}')">
      <span class="nodata-badge">${t('noData')}</span>
      <div class="card-head">
        <div class="card-flag">${v.flag}</div>
        <div class="card-state-info">
          <div class="card-state-name">${getStateLongName(code)}</div>
          <div class="card-game-name">${v.name}</div>
        </div>
      </div>
      <div class="card-body" style="color:var(--muted2);font-size:.72rem;padding:12px 14px">
        Cliquez pour charger
      </div>
      <div class="card-footer">
        <span class="card-schedule">${formatSchedule(v.schedule)}</span>
        <button class="card-view-btn" onclick="event.stopPropagation();openDetail('${code}')">Charger →</button>
      </div>
    </div>`;
  }

  const badge = v.is_today
    ? `<span class="today-badge">🟢 ${t('today')}</span>`
    : v.is_yesterday
    ? `<span class="yesterday-badge">🕐 ${t('yesterday')}</span>`
    : '';

  const drawsHtml = v.latest.slice(0,4).map(d=>{
    const todClass = d.tod==='Midday'?'tod-midday':d.tod==='Evening'?'tod-evening':d.tod==='Morning'?'tod-morning':d.tod==='Night'?'tod-night':'tod-day';
    const balls = [d.d1,d.d2,d.d3].map(n=>
      `<div class="dball" style="width:28px;height:28px;background:${bc(n)}22;border-color:${bc(n)};color:${bc(n)};font-size:11px">${n}</div>`
    ).join('');
    return `<div class="draw-row">
      <span class="draw-tod">${d.tod?t('tod_'+d.tod):''}</span>
      <div class="draw-balls">${balls}</div>
    </div>`;
  }).join('');

  const dateStr = v.latest_date ? formatDate(v.latest_date) : '—';

  return `<div class="state-card" onclick="openDetail('${code}')">
    ${badge}
    <div class="card-head">
      <div class="card-flag">${v.flag}</div>
      <div class="card-state-info">
        <div class="card-state-name">${getStateLongName(code)}</div>
        <div class="card-game-name">${v.name}</div>
      </div>
    </div>
    <div class="card-body">
      <div class="card-date">${dateStr}</div>
      ${drawsHtml}
    </div>
    <div class="card-footer">
      <span class="card-schedule">${formatSchedule(v.schedule)}</span>
      <button class="card-view-btn" onclick="event.stopPropagation();openDetail('${code}')">Historique →</button>
    </div>
  </div>`;
}

// ══════════════════════════════════════
// DETAIL PANEL
// ══════════════════════════════════════
let _detailState = null;
let _detailYear  = null;
let _detailMonth = null;
const MONTH_NAMES_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTH_NAMES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function monthName(m, y){
  const names = LANG==='en' ? MONTH_NAMES_EN : MONTH_NAMES_FR;
  return `${names[m-1]} ${y}`;
}

function openDetail(code){
  const now = new Date();
  _detailState = code;
  _detailYear  = now.getFullYear();
  _detailMonth = now.getMonth() + 1;

  const v = _statesData ? _statesData[code] : {};
  document.getElementById('detailFlag').textContent = v.flag || '🎰';
  document.getElementById('detailStateName').textContent = getStateLongName(code);
  document.getElementById('detailGameName').textContent = v.name || code;

  // Schedule
  const sched = (v.schedule || []).map(s=>
    `<div class="sched-item"><span class="sched-tod">${t('tod_'+s.tod)}</span><span class="sched-time">${s.time}</span></div>`
  ).join('');
  document.getElementById('scheduleStrip').innerHTML = sched || '';

  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  document.body.style.overflow = 'hidden';

  loadDetailMonth();
  loadComments();
}

function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  document.body.style.overflow = '';
}

// ══════════════════════════════════════
// COMMENTS
// ══════════════════════════════════════
let _currentUser = undefined; // undefined = pas encore vérifié, null = non connecté

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso+'Z').getTime()) / 1000;
  if(diff < 60) return t('commentsJustNow');
  const mins = Math.floor(diff/60);
  if(mins < 60) return `${mins}min`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h`;
  const days = Math.floor(hrs/24);
  return `${days}j`;
}

async function getCurrentUser(){
  if(_currentUser !== undefined) return _currentUser;
  try{
    const r = await fetch('/api/auth/me');
    const data = await r.json();
    _currentUser = data.user || null;
  }catch(e){
    _currentUser = null;
  }
  return _currentUser;
}

async function loadComments(){
  document.getElementById('commentsTitle').textContent = t('commentsTitle');
  document.getElementById('commentInput').placeholder = t('commentsPlaceholder');
  document.getElementById('commentSendBtn').textContent = t('commentsSend');

  const user = await getCurrentUser();
  const form = document.getElementById('commentForm');
  const loginBox = document.getElementById('commentsLoginBox');
  if(user){
    form.style.display = 'flex';
    loginBox.innerHTML = '';
  }else{
    form.style.display = 'none';
    loginBox.innerHTML = `<div class="comment-login">${t('commentsLoginMsg')} <a href="/login">${t('commentsLoginBtn')}</a></div>`;
  }

  const list = document.getElementById('commentList');
  list.innerHTML = '<div class="spinner"></div>';
  try{
    const r = await fetch(`/api/comments/${_detailState}`);
    const data = await r.json();
    renderComments(data.comments || []);
  }catch(e){
    list.innerHTML = '';
  }
}

function renderComments(comments){
  const list = document.getElementById('commentList');
  if(!comments.length){
    list.innerHTML = `<div class="comments-empty">${t('commentsEmpty')}</div>`;
    return;
  }
  list.innerHTML = comments.map(c=>`
    <div class="comment-item">
      <div class="comment-head">
        <span class="comment-author">${escapeHtml(c.username)}</span>
        <span class="comment-date">${timeAgo(c.created_at)}</span>
      </div>
      <div class="comment-body">${escapeHtml(c.body)}</div>
      ${c.is_own ? `<button class="comment-delete" onclick="deleteComment(${c.id})">${t('commentsDelete')}</button>` : ''}
    </div>`).join('');
}

document.getElementById('commentForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('commentInput');
  const body = input.value.trim();
  if(!body) return;
  const btn = document.getElementById('commentSendBtn');
  btn.disabled = true;
  try{
    const r = await fetch(`/api/comments/${_detailState}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({body})
    });
    if(r.ok){
      input.value = '';
      loadComments();
    }
  }finally{
    btn.disabled = false;
  }
});

async function deleteComment(id){
  try{
    const r = await fetch(`/api/comments/${id}`, {method:'DELETE'});
    if(r.ok) loadComments();
  }catch(e){}
}

function changeMonth(delta){
  _detailMonth += delta;
  if(_detailMonth < 1){ _detailMonth = 12; _detailYear--; }
  if(_detailMonth > 12){ _detailMonth = 1; _detailYear++; }
  loadDetailMonth();
}

async function loadDetailMonth(){
  const now = new Date();
  const isPast = _detailYear < now.getFullYear() ||
    (_detailYear === now.getFullYear() && _detailMonth <= now.getMonth()+1);

  // Disable next if at current month
  const isCurrentMonth = _detailYear === now.getFullYear() && _detailMonth === now.getMonth()+1;
  const isMaxFuture = _detailYear > now.getFullYear() ||
    (_detailYear === now.getFullYear() && _detailMonth > now.getMonth()+1);
  document.getElementById('nextMonthBtn').disabled = isCurrentMonth || isMaxFuture;

  // Disable prev if too far back (1 year limit)
  const minDate = new Date(); minDate.setFullYear(minDate.getFullYear()-2);
  const isMinDate = new Date(_detailYear, _detailMonth-2, 1) <= minDate;
  document.getElementById('prevMonthBtn').disabled = isMinDate;

  document.getElementById('monthLabel').textContent = monthName(_detailMonth, _detailYear);
  document.getElementById('monthDrawsCount').textContent = '';
  document.getElementById('detailContent').innerHTML = '<div class="spinner"></div>';

  try{
    const r = await fetch(`/api/results/${_detailState}/month/${_detailYear}/${_detailMonth}`);
    const data = await r.json();
    if(data.error){
      document.getElementById('detailContent').innerHTML = `
        <div class="no-data-msg">
          <div class="nd-icon">📭</div>
          <p>${data.error}</p>
          <button class="detail-scrape-btn" onclick="scrapeDetail()">${t('scrapeBtn')}</button>
        </div>`;
      return;
    }
    document.getElementById('monthDrawsCount').textContent = `${data.total} ${t('draws')}`;
    renderDetailDays(data.days);
  } catch(e){
    document.getElementById('detailContent').innerHTML = `<div class="no-data-msg"><p>Erreur: ${e.message}</p></div>`;
  }
}

function renderDetailDays(days){
  // Tirages dates en heure US (ET) - on aligne "aujourd'hui" sur ce fuseau.
  const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'});
  if(!days || !days.length){
    document.getElementById('detailContent').innerHTML = `
      <div class="no-data-msg">
        <div class="nd-icon">📭</div>
        <p>${t('noDataMsg')}</p>
        <button class="detail-scrape-btn" onclick="scrapeDetail()">${t('scrapeBtn')}</button>
      </div>`;
    return;
  }

  const html = days.map(day=>{
    const isToday = day.date === today;
    const dayObj = new Date(day.date + 'T12:00:00');
    const dayName = dayObj.toLocaleDateString(LANG==='en'?'en-US':'fr-FR', {weekday:'long'});
    const dateStr = dayObj.toLocaleDateString(LANG==='en'?'en-US':'fr-FR', {day:'numeric',month:'long',year:'numeric'});
    const todayTag = isToday ? `<span class="day-today-tag">${t('today')}</span>` : '';

    const drawsHtml = day.draws.map(d=>{
      const todClass = d.tod==='Midday'?'tod-midday':d.tod==='Evening'?'tod-evening':d.tod==='Morning'?'tod-morning':d.tod==='Night'?'tod-night':'tod-day';
      const balls = [d.d1,d.d2,d.d3].map(n=>
        `<div class="detail-ball" style="background:${bc(n)}22;border-color:${bc(n)};color:${bc(n)}">${n}</div>`
      ).join('');
      const sumVal = parseInt(d.d1)+parseInt(d.d2)+parseInt(d.d3);
      const combo = `${d.d1}-${d.d2}-${d.d3}`;
      return `<div class="detail-draw-row">
        <span class="detail-tod ${todClass}">${d.tod?t('tod_'+d.tod):t('draws')}</span>
        <div class="detail-balls">${balls}</div>
        <span class="detail-sum">Σ${sumVal}</span>
        <span class="detail-share" onclick="shareResult('${getStateLongName(_detailState)}','${combo}','${d.tod}','${day.date}')" title="Partager">📤</span>
      </div>`;
    }).join('');

    return `<div class="day-block">
      <div class="day-block-head">
        <div>
          <div class="day-name">${capitalize(dayName)} ${todayTag}</div>
          <div class="day-date">${dateStr}</div>
        </div>
      </div>
      <div class="day-draws">${drawsHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('detailContent').innerHTML = html;
}

// ── SSE Live Stream : réception instantanée des nouveaux tirages ──────────
let _sseConn = null;
let _sseFallbackTimer = null;

function _showDrawToast(d){
  // Crée un toast en bas-droite
  let wrap = document.getElementById('_toastWrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = '_toastWrap';
    wrap.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column-reverse;gap:10px;pointer-events:none';
    document.body.appendChild(wrap);
  }
  const digits = `${d.d1}-${d.d2}-${d.d3}`;
  const todIcon = d.tod === 'Midday' ? '☀️' : '🌙';
  const toast = document.createElement('div');
  toast.style.cssText = 'background:#1e1e2e;border:1.5px solid #7c3aed;border-radius:12px;padding:12px 18px;color:#e2e8f0;font-size:13px;box-shadow:0 8px 32px #0008;max-width:280px;animation:_toastIn .25s ease;pointer-events:auto';

  // Ajouter style keyframe si manquant

function _refreshStateCard(state){
  // Met à jour uniquement la carte de l'état concerné sans recharger tout
  if(!_statesData) return;
  fetch(`/api/results/latest?n=3`)
    .then(r=>r.json())
    .then(latest=>{
      if(!latest[state]) return;
      // Fusionne dans les données existantes
      _statesData[state] = Object.assign({}, _statesData[state], { draws: latest[state] });
      renderGrid(_statesData, getActiveFilterFn());
    })
    .catch(()=> loadAll()); // fallback complet si endpoint absent
}

function startLiveStream(){
  if(_sseConn){ try{ _sseConn.close(); }catch(e){} }
  clearTimeout(_sseFallbackTimer);

  const es = new EventSource('/api/results/stream');
  _sseConn = es;

  es.addEventListener('new_draw', e => {
    try{
      const d = JSON.parse(e.data);
      _showDrawToast(d);
      _refreshStateCard(d.state);
      if(_detailState === d.state) loadDetailMonth();
    }catch(err){}
  });

  es.onopen = () => {
    // SSE connecté : annule le fallback polling si actif
    clearTimeout(_sseFallbackTimer);
    console.log('[SSE] connecté au flux de tirages');
  };

  es.onerror = () => {
    es.close();
    _sseConn = null;
    // Reconnexion automatique après 15 s
    _sseFallbackTimer = setTimeout(startLiveStream, 15000);
    // Pendant l'absence de SSE, un seul refresh immédiat
    loadAll();
  };
}

document.addEventListener('DOMContentLoaded', startLiveStream);
if(document.readyState !== 'loading') startLiveStream();

// ── Prochain tirage : calcul du temps restant ─────────────────────────────
function _parseDrawTime(timeStr){
  // timeStr ex: "12:30 PM ET", "1:30 PM ET", "6:59 PM CT"
  const m = timeStr.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return null;
  let h = parseInt(m[1]), min = parseInt(m[2]);
  const ap = m[3].toUpperCase();
  if(ap==='PM' && h!==12) h += 12;
  if(ap==='AM' && h===12) h = 0;
  // Détecte la timezone (ET/CT/MT/PT)
  const tzMatch = timeStr.match(/\b(ET|CT|MT|PT)\b/i);
  const offsets = {ET:-5, CT:-6, MT:-7, PT:-8}; // heure standard (approx)
  const tzOff   = offsets[(tzMatch?.[1]||'ET').toUpperCase()] ?? -5;
  // Heure locale actuelle
  const now     = new Date();
  const utcNow  = now.getTime() + now.getTimezoneOffset()*60000;
  const drawMs  = new Date(utcNow + tzOff*3600000);
  drawMs.setHours(h, min, 0, 0);
  let diff = drawMs - (utcNow + tzOff*3600000);
  if(diff < -30*60000) diff += 86400000; // tirage déjà passé → demain
  return diff; // ms
}

function _nextDraw(schedule){
  if(!schedule?.length) return null;
  let best = null;
  for(const s of schedule){
    const ms = _parseDrawTime(s.time);
    if(ms == null) continue;
    if(ms < 0) continue; // passé
    if(best===null || ms < best.ms) best = {tod: s.tod, time: s.time, ms};
  }
  return best;
}

function _fmtCountdown(ms){
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  if(h > 0) return `${h}h ${m}m`;
  return `${m} min`;
}

// Injecte les CTA dans les cartes après rendu
function _injectDrawCTAs(){
  if(!_statesData) return;
  document.querySelectorAll('.state-card[data-code]').forEach(card=>{
    const code = card.dataset.code;
    const v    = _statesData[code];
    if(!v?.schedule) return;
    const next = _nextDraw(v.schedule);
    if(!next || next.ms > 3*3600000) return; // > 3h → pas de CTA
    // Évite doublon
    if(card.querySelector('._draw-cta')) return;
    const urgent  = next.ms < 30*60000;  // < 30 min
    const soonish = next.ms < 90*60000;  // < 90 min
    const label   = _fmtCountdown(next.ms);
    const cta = document.createElement('div');
    cta.className = '_draw-cta';
    cta.style.cssText = 'padding:0 12px 10px';
    cta.innerHTML = urgent
      ? `<a href="/analyze?state=${code}&tod=${next.tod}" onclick="event.stopPropagation()"
          style="display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:.72rem;font-weight:800;text-decoration:none;color:#fff;background:linear-gradient(135deg,#dc2626,#ef4444);animation:_ctaPulse 1.5s infinite;letter-spacing:.3px">
          🔴 TIRAGE DANS ${label} — Analyser ${code} ${next.tod}
        </a>`
      : `<a href="/analyze?state=${code}&tod=${next.tod}" onclick="event.stopPropagation()"
          style="display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:10px;font-size:.72rem;font-weight:700;text-decoration:none;color:#a78bfa;background:rgba(124,58,237,.12);border:1px solid rgba(124,58,237,.3)">
          ⚡ Analyser ${code} ${next.tod} — dans ${label}
        </a>`;
    card.appendChild(cta);
  });
}

let _pushSub = null;

async function _urlB64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const b64 = (base64String + padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(b64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

async function _getPushSub(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return await reg.pushManager.getSubscription();
}

async function togglePushNotif(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Votre navigateur ne supporte pas les notifications push.');
    return;
  }
  const existing = await _getPushSub();
  if(existing){
    // Déjà abonné → ouvrir le modal de préférences
    _openPushModal(existing);
    return;
  }
  // Pas encore abonné → permission + abonnement → puis modal
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    alert('Permission refusée. Activez les notifications dans les paramètres du navigateur.');
    return;
  }
  const kRes  = await fetch('/api/push/vapid-public-key');
  const kData = await kRes.json();
  if(kData.error){ alert('Push non configuré côté serveur.'); return; }
  const appServerKey = await _urlB64ToUint8Array(kData.key);
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: appServerKey });
  await fetch('/api/push/subscribe', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ subscription: sub.toJSON(), states: _pushStates })
  });
  _updatePushBtn();
  _openPushModal(sub);
}

      </div>
      <div style="padding:14px 20px 8px">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:10px">
          <input type="checkbox" id="_pushAll" ${isAll?'checked':''} style="accent-color:#7c3aed;width:16px;height:16px"
            onchange="_togglePushAll(this.checked)">

        </label>
      </div>

      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });

function _togglePushAll(checked){
  const list = document.getElementById('_pushStateList');
  if(list) list.style.cssText += checked ? ';opacity:.4;pointer-events:none' : ';opacity:1;pointer-events:auto';
}

async function _savePushPrefs(endpoint){
  const allChk = document.getElementById('_pushAll');
  let states;
  if(allChk?.checked){
    states = ['ALL'];
  } else {
    states = [...document.querySelectorAll('#_pushStateList input:checked')].map(i=>i.value);
    if(!states.length) states = ['ALL'];
  }
  _pushStates = states;
  localStorage.setItem('_push_states', JSON.stringify(states));
  await fetch('/api/push/preferences', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ endpoint, states })
  });
  document.getElementById('_pushModal')?.remove();
  _updatePushBtn();
  _showDrawToast({state_name:'Préférences', tod:'', d1:'✅', d2:'', d3:'', date:'', source:'sauvegardées'});
}

async function _unsubscribePush(endpoint){
  const sub = await _getPushSub();
  if(sub) await sub.unsubscribe();
  await fetch('/api/push/unsubscribe', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ endpoint })
  });
  _pushStates = ['ALL'];
  localStorage.removeItem('_push_states');
  document.getElementById('_pushModal')?.remove();
  _updatePushBtn();
}
