 body:`
<h2>1. Data we collect</h2>
<p>PREDIKTA collects the following data:</p>

<p>Your data is used to:</p>
<ul>

<p>PREDIKTA uses your browser's <strong>localStorage</strong> to store your preferences (language, theme, favorites). No personal data is stored in cookies.</p>
<p>If you enable Google Analytics (disabled by default), third-party cookies may be set in accordance with Google's policy.</p>

<p>We never sell, rent or share your personal data with third parties, except:</p>
<ul>
  <li>With your explicit consent</li>
  <li>To comply with a legal obligation</li>

</ul>
<h2>5. Affiliate links</h2>
<p>PREDIKTA displays affiliate links to partners (TheLotter, LotteryPro, Jackpot.com). If you click these links, those partners may set their own cookies. Refer to their respective privacy policies for more information.</p>
<h2>6. Your rights</h2>
<p>In accordance with GDPR and CCPA, you have the following rights:</p>
<ul>
  <li><strong>Right of access</strong> — Request a copy of your data</li>
  <li><strong>Right to rectification</strong> — Correct inaccurate data</li>

<p>To exercise these rights, contact us via <a href="/contact">our contact page</a>.</p>

<p>We implement appropriate security measures: HTTP security headers, input validation, no sensitive data stored in plain text. Our servers use HTTPS.</p>

<p>We reserve the right to modify this policy at any time. In the event of a significant change, we will notify registered users by email.</p>
<h2>9. Contact</h2>

function applyLang(lang){

  document.querySelector('[data-i18n="title"]').textContent = dict.title;
  document.querySelector('[data-i18n="updated"]').textContent = dict.updated;
  document.querySelector('[data-i18n="highlight"]').innerHTML = dict.highlight;
  document.getElementById('body').innerHTML = dict.body;
  document.documentElement.setAttribute('lang', lang);
  document.title = dict.title + " — PREDIKTA";
}
window.setLang = applyLang;
window.addEventListener('load', ()=>{
  const navLang = window.PREDIKTA_LANG || (navigator.language||'fr').slice(0,2);
  applyLang(T[navLang] ? navLang : 'fr');
});
